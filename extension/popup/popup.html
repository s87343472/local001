<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrome Smart Translation Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <h1>🌐 Smart Translator</h1>
    </header>

    <div class="popup-body">
      <div class="page-info">
        <div class="info-label">Current Page:</div>
        <div class="info-value" id="current-page">Loading...</div>
      </div>

      <div class="status-section" id="status-section">
        <div class="status-icon" id="status-icon">⚪</div>
        <div class="status-text" id="status-text">Ready to translate</div>
      </div>

      <div class="progress-section" id="progress-section" style="display: none;">
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-text" id="progress-text">Translating 0%</div>
      </div>

      <div class="action-buttons">
        <button class="btn btn-primary" id="btn-translate">
          <span class="btn-icon">🌐</span>
          <span class="btn-text">Translate Page</span>
        </button>
        <button class="btn btn-secondary" id="btn-toggle" disabled>
          <span class="btn-icon">⇄</span>
          <span class="btn-text">Toggle Display</span>
        </button>
      </div>

      <div class="quick-settings">
        <h3>Quick Settings</h3>
        <div class="setting-row">
          <label for="quick-engine" class="setting-label">Engine:</label>
          <select id="quick-engine" class="setting-select">
            <option value="gemini">Gemini</option>
            <option value="google">Google Translate</option>
          </select>
        </div>
        <div class="setting-row">
          <label for="quick-language" class="setting-label">Language:</label>
          <select id="quick-language" class="setting-select">
            <option value="zh-CN">简体中文</option>
            <option value="zh-TW">繁體中文</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="ru">Русский</option>
          </select>
        </div>
      </div>

      <div class="stats-summary">
        <div class="stat-item">
          <div class="stat-icon">📊</div>
          <div class="stat-content">
            <div class="stat-label">This Month</div>
            <div class="stat-value" id="stat-month">0 chars</div>
          </div>
        </div>
      </div>
    </div>

    <footer class="popup-footer">
      <button class="footer-btn" id="btn-settings">
        <span>⚙️</span> Settings
      </button>
      <button class="footer-btn" id="btn-stats">
        <span>📈</span> Stats
      </button>
    </footer>

    <div class="blacklist-notice" id="blacklist-notice" style="display: none;">
      <div class="notice-icon">🚫</div>
      <div class="notice-text">Translation disabled on this site</div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
